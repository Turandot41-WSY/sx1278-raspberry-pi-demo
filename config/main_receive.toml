# The sole operator configuration for main_receive.py. Start with: python main_receive.py
# Paths are relative to the project root; an empty string means unset. Only parameters for the selected action are validated.
# VS Code F5 reads the same configuration as the command above. Save the TOML, stop the old process, then restart.

# Only the parameter section for the selected action is read.
action = "listen" # listen: independent local reception. F5 and the terminal use the same selection.

[listen]
# Required: serial port of the local receiving Nano, e.g. COM4 on Windows or /dev/cu.usbserial-210 on macOS.
device = ""

# Required: build manifest for this receiving board's production firmware; rebuild and upload after changing board configuration.
manifest = "firmware/build/single-endpoint/manifest.json"

# Results root; each run creates a UTC subdirectory. events.jsonl preserves serial bytes, raw received packets and status.
output = "output/receive"

# Must match the transmitter: LoRa, FSK, GFSK, MSK, GMSK or OOK. Use LoRa for the first test.
# The current firmware receives at a fixed 437.5 MHz; check local authorization before transmitting at this frequency.
profile = "LoRa"

# Receive window in ms, range 1-65535; 5000 means 5 seconds. A new window opens after a packet or timeout.
rx_window_ms = 5000

# Additional wait for serial responses in ms, a positive integer; avoid long internal breakpoint pauses during physical communication.
timeout_ms = 2000

# Startup wait after opening UART in ms, nonnegative; the Nano may reset automatically. Normally retain 2500.
boot_settle_ms = 2500

# Maximum completed windows; 0 listens until Ctrl+C, a positive integer such as 2 selects a fixed number. This is not a transmit frame count.
max_windows = 0
