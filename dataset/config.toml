# The sole operator configuration for dataset/main.py. Start with: python dataset/main.py
# Paths are relative to the project root; an empty string means unset. Only parameters for the selected action are validated.
# VS Code F5 reads the same configuration as the command above. Save the TOML, stop the old process, then restart.
# Select the workflow with action: acquire.
action = "acquire"

# Acquire and save orbit data. Initially use fetch=true; to read frozen inputs, set fetch=false and fill in offline.
[acquire]
# Online acquisition: true downloads inputs; for offline use, set false and fill in offline. Select exactly one mode.
fetch = true
# Offline input directory; leave empty for online acquisition, e.g. dataset/data/orbit/gomx1_39430/YOUR_DATASET_DIRECTORY.
offline = ""
# Dataset output root; normally retain this value. Each run creates a new timestamp directory.
output_root = "dataset/data/orbit/gomx1_39430"
# Optional search start in UTC, e.g. 2026-09-07T00:00:00Z; provide both start and end or leave both empty.
search_start_utc = ""
# Optional search end in UTC, e.g. 2026-09-08T00:00:00Z; pair with the start. Both empty selects the default search strategy.
search_end_utc = ""
# Days searched per batch, a positive integer; normally 1. Larger values increase computation per batch.
chunk_days = 1
# Maximum lookback for historical passes in days, an integer from 1 to 30; normally 30.
maximum_lookback_days = 30
# Optional generator code version; empty reads the current Git HEAD. Use a full commit to record a specific version.
generator_git_commit = ""

# Orbit and ground station model for this entry point. Configure before acquisition; regenerate the dataset after changing it.
# main_dataset and dataset tests share the project's GOMX-1/Linz model.
# The production loader checks the model against saved provenance records; retain this configuration with the code version.
[orbit_model.sources]
# OMM orbital elements download URL, currently GOMX-1. Changing the target also requires updating the project model and validation constraints.
omm_url = "https://celestrak.org/NORAD/elements/gp.php?CATNR=39430&FORMAT=XML"
# IERS-A Earth orientation data URL, used to transform orbital coordinates to terrestrial coordinates; normally retain this value.
iers_a_url = "https://datacenter.iers.org/data/9/finals2000A.all"
# Maximum input OMM age in hours, currently 72; older inputs are rejected.
maximum_omm_age_hours = 72

[orbit_model.download]
# Client identifier for download requests; normally retain this value. Do not enter account names or keys.
user_agent = "sx1278-benchmark-orbit-freezer/1.0"
# Maximum download attempts after failure, a positive integer; currently 3.
attempts = 3
# Timeout per download attempt in seconds, positive; currently 30.
timeout_seconds = 30

[orbit_model.station]
# Ground station latitude in degrees, positive north; the current value is the project's Linz site coordinate.
latitude_deg = 48.3268334
# Ground station longitude in degrees, positive east; the current value is the project's Linz site coordinate.
longitude_deg = 14.3236695
# Station ellipsoidal height in metres; 244.0 is a proxy derived from a DEM, not a measured antenna height.
height_m = 244.0
# Minimum elevation for visible passes in degrees, selected as 10 for this project; changing it affects pass selection.
elevation_mask_deg = 10.0

[orbit_model.radio]
# Nominal carrier frequency in Hz; must match profiles.csv and the firmware tables. Regenerate affected inputs after changing it.
nominal_carrier_hz = 437500000.0
